services:
  cloudcli:
    image: ns2kracy/cloudcli:1.37.6
    user: "0:0"
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      SERVER_PORT: "3001"
      WORKSPACES_ROOT: /workspaces
      NINE_ROUTER_BASE_URL: http://9router:20128
      NINE_ROUTER_ADMIN_PASSWORD: "9router"
      CODEX_OAUTH_CALLBACK_HOST: 0.0.0.0
    ports:
      - "3001:3001"
      - "1445:1455"
    volumes:
      - "/DATA/AppData/${AppID}/:/workspaces"
      - "/DATA/AppData/${AppID}/cloudcli:/root/.cloudcli"
      - "/DATA/AppData/${AppID}/codex:/root/.codex"
    depends_on:
      9router:
        condition: service_started
    networks:
      - cloudcli-private

  9router:
    image: decolua/9router:0.5.50
    user: "0:0"
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      INITIAL_PASSWORD: "9router"
    expose:
      - "20128"
    volumes:
      - "/DATA/AppData/${AppID}/9router:/app/data"
    networks:
      - cloudcli-private

networks:
  cloudcli-private:
