services:
  cloudcli:
    image: ns2kracy/cloudcli:1.37.2
    user: "0:0"
    restart: unless-stopped
    environment:
      WORKSPACES_ROOT: /workspaces
      CODEX_OAUTH_CALLBACK_HOST: 0.0.0.0
      NINE_ROUTER_ADMIN_PASSWORD: 9router
    ports:
      - "3001:3001"
      - "1455"
    volumes:
      - /DATA/AppData/cloudcli/workspace:/workspaces
      - /DATA/AppData/cloudcli/cloudcli:/root/.cloudcli
      - /DATA/AppData/cloudcli/codex:/root/.codex
    depends_on:
      9router:
        condition: service_started
    networks:
      - cloudcli-private

  9router:
    image: ns2kracy/9router:0.5.50
    user: "0:0"
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      INITIAL_PASSWORD: 9router
    expose:
      - "20128"
    volumes:
      - /DATA/AppData/cloudcli/9router:/data
    networks:
      - cloudcli-private

networks:
  cloudcli-private:
