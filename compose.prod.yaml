services:
  cloudcli:
    image: ns2kracy/cloudcli:1.37.10
    user: "0:0"
    restart: unless-stopped
    # Bubblewrap needs namespace syscalls and mount propagation inside the container.
    # AppArmor remains enforced by Bubblewrap's own filesystem namespace boundary.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      HOST: 0.0.0.0
      SERVER_PORT: "3001"
      WORKSPACES_ROOT: /workspaces
      NINE_ROUTER_BASE_URL: http://9router:20128
      NINE_ROUTER_ADMIN_PASSWORD: "9router"
      CODEX_OAUTH_CALLBACK_HOST: 0.0.0.0
    ports:
      - "3001:3001"
      - "1445:1455"
    volumes:
      - "/DATA/AppData:/workspaces"
      - "/DATA/AppData/${AppID}/.cloudcli:/root/.cloudcli"
      - "/DATA/AppData/${AppID}/.codex:/root/.codex"
    depends_on:
      9router:
        condition: service_started
    networks:
      - codex-private

  9router:
    image: decolua/9router:0.5.50
    user: "0:0"
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      INITIAL_PASSWORD: "9router"
    expose:
      - "20128"
    volumes:
      - "/DATA/AppData/${AppID}/9router:/app/data"
    networks:
      - codex-private

networks:
  codex-private:

x-casaos:
  main: cloudcli
  title:
    custom: codexui
  port_map: "3001"
  icon: https://cloudcli.ai/icon.svg
