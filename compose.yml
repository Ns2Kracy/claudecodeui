services:
  cloudcli:
    build:
      context: .
      dockerfile: docker/cloudcli/Dockerfile
    environment:
      HOST: 0.0.0.0
      SERVER_PORT: "3001"
      WORKSPACES_ROOT: /workspaces
      NINE_ROUTER_BASE_URL: http://9router:20128
      CODEX_OAUTH_CALLBACK_HOST: 0.0.0.0
      NINE_ROUTER_ADMIN_PASSWORD: "9router"
    ports:
      - "3001:3001"
      - "127.0.0.1:1455:1455"
    volumes:
      - cloudcli-home:/root
      - "${HOST_WORKSPACES_PATH:-./workspaces}:/workspaces"
    depends_on:
      9router:
        condition: service_started
    networks:
      - cloudcli-private

  9router:
    build:
      context: ./docker/9router
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      INITIAL_PASSWORD: "9router"
    expose:
      - "20128"
    volumes:
      - 9router-data:/data
    networks:
      - cloudcli-private

volumes:
  cloudcli-home:
  9router-data:

networks:
  cloudcli-private:
